```yaml
name: Release APPoint

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false

      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"

          # macOS Intel
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

          # Linux x64
          - platform: ubuntu-22.04
            args: ""

          # Windows x64
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Linux dependencies
      # --------------------------------------------------

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # --------------------------------------------------
      # Node
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # Rust
      # --------------------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # --------------------------------------------------
      # Rust cache
      # --------------------------------------------------

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # --------------------------------------------------
      # Frontend dependencies
      # --------------------------------------------------

      - name: Install frontend dependencies
        run: npm ci

      # --------------------------------------------------
      # Verify source
      # --------------------------------------------------

      - name: Verify release source
        run: |
          node -e "console.log('Git commit:', require('child_process').execSync('git rev-parse HEAD').toString().trim())"
          node -e "console.log('Git ref:', process.env.GITHUB_REF)"
          node -e "console.log('Git ref name:', process.env.GITHUB_REF_NAME)"
          node -e "console.log('Package version:', require('./package.json').version)"

      # --------------------------------------------------
      # Build frontend explicitly
      # --------------------------------------------------

      - name: Build frontend
        run: npm run build

      # --------------------------------------------------
      # Verify frontend build
      # --------------------------------------------------

      - name: Verify frontend build
        run: |
          node -e "const fs=require('fs'); console.log('dist exists:', fs.existsSync('dist')); console.log('dist contents:', fs.readdirSync('dist')); console.log('assets contents:', fs.existsSync('dist/assets') ? fs.readdirSync('dist/assets') : 'NO ASSETS DIRECTORY')"

      # --------------------------------------------------
      # Build and publish Tauri application
      # --------------------------------------------------

      - name: Build and release APPoint
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}

          releaseName: "APPoint ${{ github.ref_name }}"

          releaseBody: |
            ## APPoint ${{ github.ref_name }}

            Download the installer for your platform below.

            This release includes automatic update support.

          releaseDraft: false

          prerelease: false

          includeUpdaterJson: true

          updaterJsonPreferNsis: true

          args: ${{ matrix.args }}
```
