name: Release APPoint

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:
  # --------------------------------------------------
  # Create the GitHub Release once
  # --------------------------------------------------

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e

          echo "Creating release for ${TAG_NAME}"

          RELEASE_ID=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/releases" \
            -f "tag_name=${TAG_NAME}" \
            -f "name=APPoint ${TAG_NAME}" \
            -f "body=## APPoint ${TAG_NAME}

          Download the installer for your platform below.

          This release includes automatic update support." \
            -F "draft=false" \
            -F "prerelease=false" \
            --jq '.id')

          echo "Release ID: ${RELEASE_ID}"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------
  # Build all platforms
  # --------------------------------------------------

  publish-tauri:
    name: Build APPoint (${{ matrix.platform }}, ${{ matrix.args }})

    needs:
      - create-release

    permissions:
      contents: write

    strategy:
      fail-fast: false

      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"

          # macOS Intel
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

          # Linux x64
          - platform: ubuntu-22.04
            args: ""

          # Windows x64
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Linux dependencies
      # --------------------------------------------------

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # --------------------------------------------------
      # Node
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # Rust
      # --------------------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # --------------------------------------------------
      # Rust cache
      # --------------------------------------------------

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # --------------------------------------------------
      # Frontend dependencies
      # --------------------------------------------------

      - name: Install frontend dependencies
        run: npm ci

      # --------------------------------------------------
      # Verify source
      # --------------------------------------------------

      - name: Verify release source
        shell: bash
        run: |
          echo "Git commit: $(git rev-parse HEAD)"
          echo "Git ref: ${GITHUB_REF}"
          echo "Git ref name: ${GITHUB_REF_NAME}"
          echo "Package version: $(node -p "require('./package.json').version")"

      # --------------------------------------------------
      # Build frontend
      # --------------------------------------------------

      - name: Build frontend
        run: npm run build

      # --------------------------------------------------
      # Verify frontend build
      # --------------------------------------------------

      - name: Verify frontend build
        shell: bash
        run: |
          echo "dist exists:"
          test -d dist && echo "YES" || echo "NO"

          echo "dist contents:"
          ls -la dist

          echo "assets:"
          if [ -d dist/assets ]; then
            ls -la dist/assets
          else
            echo "NO ASSETS DIRECTORY"
          fi

      # --------------------------------------------------
      # Build and upload Tauri artifacts
      # --------------------------------------------------

      - name: Build and release APPoint
        uses: tauri-apps/tauri-action@v1

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

          tagName: ${{ github.ref_name }}

          releaseName: "APPoint ${{ github.ref_name }}"

          releaseDraft: false

          prerelease: false

          includeUpdaterJson: true

          updaterJsonPreferNsis: true

          args: ${{ matrix.args }}
